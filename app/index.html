<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0D0F12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="OPERIVA">
<meta name="description" content="Приложение лаборатории AISI LAB">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<style>html,body{margin:0;height:100%}img{max-width:100%}[hidden]{display:none!important}
@media (max-width:520px){.device{padding-top:env(safe-area-inset-top,0px)}}</style>
<title>OPERIVA App</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: дизайн-система сайта OPERIVA. Белые и светло-серые секции, тёмно-синие блоки для AURA и НАЛ, карточки 20px с тонкой рамкой, синий акцент, статусы Пилот / Услуга / Прототип. */
:root{
  --bg:#FFFFFF; --bg2:#F4F4F2; --card:#FFFFFF; --ink:#0D0F12; --ink2:#2A2E35; --muted:#555A63; --line:#E4E4E1; --line2:#D2D2CE;
  --accent:#1D4ED8; --accent-ink:#FFFFFF; --accent-soft:#EDF2FE; --accent-line:#C9D7FB;
  --pilot:#047857; --pilot-bg:#E7F8EF; --proto:#A3570A; --proto-bg:#FFF3E0; --bad:#B42318; --bad-bg:#FDECEA;
  --navy:#0A1020; --navy2:#111A33; --s-ink:#E8EDFF; --s-muted:#9AA6CF; --s-line:rgba(140,160,255,.16);
  --stage:#E9E9E6; --shadow:0 1px 2px rgba(16,18,30,.04),0 8px 24px -10px rgba(16,18,30,.12);
  --f-d:"Inter Tight","Inter",system-ui,sans-serif; --f-b:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; --f-m:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B0D12; --bg2:#10131A; --card:#151922; --ink:#ECEEF2; --ink2:#C9CED8; --muted:#9AA1AD; --line:#232833; --line2:#303643;
  --accent:#7C9DFF; --accent-ink:#0B0D12; --accent-soft:#18213F; --accent-line:#2B3A6B;
  --pilot:#5FD3A4; --pilot-bg:#0F2A20; --proto:#F0B068; --proto-bg:#33240F; --bad:#FF8A7A; --bad-bg:#3A1714;
  --stage:#050608; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -10px rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B0D12; --bg2:#10131A; --card:#151922; --ink:#ECEEF2; --ink2:#C9CED8; --muted:#9AA1AD; --line:#232833; --line2:#303643;
  --accent:#7C9DFF; --accent-ink:#0B0D12; --accent-soft:#18213F; --accent-line:#2B3A6B;
  --pilot:#5FD3A4; --pilot-bg:#0F2A20; --proto:#F0B068; --proto-bg:#33240F; --bad:#FF8A7A; --bad-bg:#3A1714;
  --stage:#050608; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -10px rgba(0,0,0,.6); color-scheme:dark}

html,body{height:100%}
body{background:var(--stage);color:var(--ink);font-family:var(--f-b);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
[hidden]{display:none!important}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0;text-align:inherit}
input{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.num{font-variant-numeric:tabular-nums}

.stage{min-height:100%;display:flex;align-items:center;justify-content:center;gap:60px;padding-block:24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.aside{display:none!important;max-width:290px;display:flex;flex-direction:column;gap:16px}
.aside h1{font-family:var(--f-d);font-weight:700;font-size:34px;line-height:1.05;margin:0;letter-spacing:-.03em}
.aside p{margin:0;color:var(--muted);font-size:14px}
.aside .roles{display:grid;gap:8px}
.aside .roles button{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-weight:600;font-size:14px}
.aside .roles button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
.device{position:relative;width:390px;height:844px;flex:none;transform-origin:center center;border:0;background:var(--bg);border-radius:46px;overflow:hidden;box-shadow:0 0 0 10px #0D0F12,0 40px 90px -30px rgba(10,16,32,.45);display:flex;flex-direction:column;isolation:isolate}
@media (max-width:520px){.aside{display:none}.stage{padding:0;display:block;height:100%}.device{width:100%;height:100%;border-radius:0;box-shadow:none}}
.view{flex:1;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;position:relative}
.view::-webkit-scrollbar{display:none}
.view.anim{animation:vin .3s cubic-bezier(.22,1,.36,1)}
@keyframes vin{from{opacity:.2;transform:translateY(6px)}}

/* type from site */
.eyebrow{display:flex;align-items:center;gap:8px;font-size:11.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.eyebrow::before{content:"";width:14px;height:1.5px;background:currentColor}
.eyebrow.mut{color:var(--muted)}
.h1{font-family:var(--f-d);font-weight:700;font-size:34px;line-height:1.04;letter-spacing:-.035em;margin:0;text-wrap:balance}
.h2{font-family:var(--f-d);font-weight:700;font-size:26px;line-height:1.08;letter-spacing:-.03em;margin:0;text-wrap:balance}
.h3{font-family:var(--f-d);font-weight:600;font-size:18px;line-height:1.2;letter-spacing:-.015em;margin:0}
.blue{color:var(--accent)}
.lead{margin:0;color:var(--ink2);font-size:15.5px;line-height:1.55}
.mut{color:var(--muted)}
.mono{font-family:var(--f-m);font-size:11.5px;color:var(--accent)}
.lbl{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}

/* layout */
.topbar{display:flex;align-items:center;justify-content:space-between;padding:16px 20px 12px;position:sticky;top:0;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);z-index:5;border-bottom:1px solid transparent}
.logo{display:flex;align-items:center;gap:8px;font-family:var(--f-d);font-weight:700;font-size:16px;letter-spacing:-.01em}
.logo i{width:24px;height:24px;border-radius:7px;background:#0D0F12;display:grid;place-items:center}
.logo i::after{content:"";width:9px;height:9px;border-radius:50%;border:2px solid #7C9DFF}
.logo small{font-family:var(--f-b);font-weight:500;font-size:11px;color:var(--muted);padding-left:8px;border-left:1px solid var(--line2);letter-spacing:.02em}
.sec{padding:24px 20px 0;display:flex;flex-direction:column;gap:14px}
.sec.grey{background:var(--bg2);padding-bottom:26px;margin-top:26px}
.sec.dark{background:var(--navy);color:var(--s-ink);padding-bottom:28px;margin-top:26px}
.sec.dark .lead{color:var(--s-muted)}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.sec-h button,.lnk{font-size:13.5px;font-weight:600;color:var(--accent);display:inline-flex;align-items:center;gap:4px}
.lnk svg{width:15px;height:15px}
.foot{padding:22px 20px 28px;font-size:12px;color:var(--muted)}

.card{background:var(--card);border:1px solid var(--line);border-radius:20px}
.tile{width:40px;height:40px;border-radius:12px;background:var(--bg2);border:1px solid var(--line);display:grid;place-items:center;flex:none;color:var(--ink2)}
.tile svg{width:19px;height:19px}
.tile.blue{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap;line-height:1.3}
.p-pilot{background:var(--pilot-bg);color:var(--pilot)}.p-proto{background:var(--proto-bg);color:var(--proto)}.p-svc{background:var(--accent-soft);color:var(--accent)}.p-bad{background:var(--bad-bg);color:var(--bad)}.p-mut{background:var(--bg2);color:var(--muted);border:1px solid var(--line)}
.pill.dot::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:14px 20px;border-radius:12px;background:var(--accent);color:var(--accent-ink);font-weight:600;font-size:15px;white-space:nowrap;transition:transform .1s}
.btn:active{transform:scale(.98)}
.btn.dark{background:var(--ink);color:var(--bg)}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line2)}
.btn.white{background:#fff;color:#0D0F12}
.btn.full{width:100%}
.btn.sm{padding:9px 13px;font-size:13.5px;border-radius:10px}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn svg{width:17px;height:17px}
.chip{flex:none;padding:8px 13px;border-radius:999px;border:1px solid var(--line2);background:var(--card);font-size:13px;font-weight:500;white-space:nowrap;text-align:left}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -20px;padding:2px 20px}
.chips::-webkit-scrollbar{display:none}
.seg{display:flex;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:3px}
.seg button{flex:1;padding:8px 6px;border-radius:9px;font-size:13px;font-weight:600;color:var(--muted);text-align:center}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}

/* AURA dark card, как на сайте */
.aura{position:relative;border-radius:24px;background:radial-gradient(90% 80% at 60% 20%,#13235A 0%,var(--navy) 62%);overflow:hidden;color:var(--s-ink);min-height:370px;display:flex;flex-direction:column;justify-content:flex-end;padding:16px}
.aura img{position:absolute;left:50%;top:-14px;height:300px;transform:translateX(-50%);-webkit-mask-image:radial-gradient(52% 58% at 50% 42%,#000 50%,transparent 100%);mask-image:radial-gradient(52% 58% at 50% 42%,#000 50%,transparent 100%);pointer-events:none}
.aura .live{position:relative;display:flex;align-items:center;gap:7px;font-size:13px;font-weight:500;margin-bottom:10px}
.aura .live::before{content:"";width:7px;height:7px;border-radius:50%;background:#22C55E;box-shadow:0 0 0 3px rgba(34,197,94,.2)}
.aura .qs{position:relative;display:flex;flex-wrap:wrap;gap:6px}
.aura .qs button{padding:8px 12px;border-radius:999px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.18);font-size:13px;font-weight:600;color:#fff}
.aura .qs button:hover{background:rgba(255,255,255,.12)}

/* stats row like site hero */
.stats{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);padding-top:14px;gap:10px}
.stats b{display:block;font-family:var(--f-d);font-size:19px;font-weight:700;letter-spacing:-.02em}
.stats span{font-size:12px;color:var(--muted);line-height:1.35;display:block}

/* tab bar */
.tabbar{display:grid;grid-template-columns:repeat(5,1fr);background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 4px calc(10px + env(safe-area-inset-bottom,0px))}
.tabbar.four{grid-template-columns:repeat(4,1fr)}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:500;color:var(--muted);padding:5px 0;position:relative}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--accent);font-weight:600}
.tab img{width:24px;height:24px;border-radius:50%;object-fit:cover;box-shadow:0 0 0 1.5px var(--line2)}
.tab[aria-current="page"] img{box-shadow:0 0 0 2px var(--accent)}
.tab .dot{position:absolute;top:1px;left:calc(50% + 6px);min-width:17px;height:17px;border-radius:9px;background:var(--accent);color:var(--accent-ink);font-size:10px;display:grid;place-items:center;padding:0 4px;font-weight:700;border:2px solid var(--bg)}

/* lists */
.list{display:flex;flex-direction:column}
.list > *{border-bottom:1px solid var(--line)}
.list > *:last-child{border-bottom:0}
.rowi{display:flex;align-items:center;gap:12px;padding:13px 16px;width:100%;text-align:left}
.rowi .t{flex:1;min-width:0}
.rowi .t b{display:block;font-weight:600;font-size:15px;line-height:1.3}
.rowi .t span{display:block;font-size:12.5px;color:var(--muted);margin-top:1px}
.rowi .r{text-align:right;font-weight:600;white-space:nowrap}
.rowi .r small{display:block;font-weight:500;font-size:11.5px;color:var(--muted)}
.chev{width:16px;height:16px;color:var(--muted);flex:none;display:inline-flex}

/* product grid like "Что мы делаем" */
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pc{padding:14px;display:flex;flex-direction:column;justify-content:space-between;gap:26px;text-align:left;min-height:132px;box-shadow:none;transition:border-color .15s}
.pc:hover{border-color:var(--line2)}
.pc .top{display:flex;justify-content:space-between;align-items:flex-start}
.pc b{font-family:var(--f-d);font-size:15.5px;font-weight:600;letter-spacing:-.01em;line-height:1.2}
.ctabar-dark{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#0D0F12;color:#fff;border-radius:16px;padding:16px 18px;font-family:var(--f-d);font-weight:600;font-size:15px;width:100%;text-align:left}
.ctabar-dark span{color:#7C9DFF;font-family:var(--f-b);font-size:14px;display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.ctabar-dark svg{width:15px;height:15px}

/* numbered trio like pilot block */
.trio{display:grid;grid-template-columns:1fr;border:1px solid var(--line);border-radius:20px;background:var(--card)}
.trio div{padding:16px;display:flex;flex-direction:column;gap:4px}
.trio div+div{border-top:1px solid var(--line)}
.trio b{font-family:var(--f-d);font-size:17px;font-weight:600;letter-spacing:-.01em}
.trio span{font-size:14px;color:var(--muted)}
.checkgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.checkgrid div{display:flex;gap:8px;align-items:flex-start;padding:12px;border:1px solid var(--line);background:var(--card);border-radius:16px;font-size:13.5px;font-weight:600;line-height:1.3}
.checkgrid svg{width:16px;height:16px;color:var(--accent);flex:none;margin-top:1px}

/* NAL */
.nal{position:relative;height:250px;margin:0 -20px}
.nal canvas{width:100%;height:100%;display:block}
.memrows{border-radius:16px;background:var(--navy2);overflow:hidden}
.memrows div{display:grid;grid-template-columns:128px 1fr;gap:10px;padding:13px 16px;font-size:14px}
.memrows div+div{border-top:1px solid var(--s-line)}
.memrows b{font-family:var(--f-d);font-weight:600}
.memrows span{color:var(--s-muted)}

/* requests */
.req{padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.req .h{display:flex;justify-content:space-between;gap:10px;align-items:center}
.req b{font-weight:600;font-size:15px}
.req .m{font-size:12.5px;color:var(--muted)}
.track{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.track div{display:flex;flex-direction:column;gap:5px;font-size:11px;font-weight:600;color:var(--muted)}
.track i{height:3px;border-radius:2px;background:var(--line)}
.track div.on{color:var(--ink)}.track div.on i{background:var(--accent)}
.track div.cur{color:var(--accent)}
.track div.cur i{background:linear-gradient(90deg,var(--accent) 50%,var(--line) 50%);background-size:200% 100%;animation:fill 1.6s ease-in-out infinite alternate}
@keyframes fill{from{background-position:100% 0}to{background-position:0 0}}

/* memory box */
.memory{border:1px dashed var(--accent-line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:8px;background:color-mix(in srgb,var(--accent-soft) 40%,transparent)}
.memory .mono{letter-spacing:.06em;text-transform:uppercase}
.memory .mi{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:14px}
.memory .mi span{display:flex;gap:8px;align-items:baseline}
.memory .mi span::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--accent);flex:none;transform:translateY(-2px)}
.memory .mi button{font-size:12.5px;color:var(--muted);font-weight:600}

/* sheet */
.sheetwrap{position:absolute;inset:0;z-index:30;display:flex;flex-direction:column;justify-content:flex-end;background:rgba(10,16,32,.42);animation:fade .2s}
@keyframes fade{from{opacity:0}}
.sheet{background:var(--bg);border-radius:24px 24px 0 0;max-height:90%;overflow-y:auto;padding:10px 20px calc(20px + env(safe-area-inset-bottom,0px));animation:up .32s cubic-bezier(.22,1,.36,1);display:flex;flex-direction:column;gap:16px;scrollbar-width:none}
@keyframes up{from{transform:translateY(35%)}}
.grab{width:38px;height:4px;border-radius:2px;background:var(--line2);align-self:center}
.sheet p{margin:0;color:var(--ink2)}
.kv{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:16px;background:var(--card)}
.kv div{padding:11px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kv div+div{border-left:1px solid var(--line)}
.kv span{font-size:11.5px;color:var(--muted)}
.kv b{font-size:14px;font-weight:600}
.stepper{display:flex;align-items:center;gap:14px}
.stepper button{width:38px;height:38px;border-radius:12px;border:1px solid var(--line2);font-size:19px;display:grid;place-items:center;background:var(--card)}
.stepper b{font-family:var(--f-d);font-size:20px;min-width:22px;text-align:center}
.total{display:flex;justify-content:space-between;align-items:baseline;border-top:1px solid var(--line2);padding-top:12px}
.total b{font-family:var(--f-d);font-size:32px;font-weight:700;letter-spacing:-.03em}

.toast{position:absolute;left:50%;bottom:100px;transform:translate(-50%,14px);opacity:0;background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:12px;font-size:13.5px;font-weight:500;transition:.25s;pointer-events:none;white-space:nowrap;z-index:40}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* chat */
.chat{display:flex;flex-direction:column;height:100%}
.chead{display:flex;align-items:center;gap:12px;padding:14px 20px;border-bottom:1px solid var(--line)}
.chead img{width:42px;height:42px;border-radius:50%;object-fit:cover;box-shadow:0 0 0 2px var(--accent-line)}
.chead b{display:block;font-family:var(--f-d);font-size:17px;font-weight:600}
.chead span{font-size:12.5px;color:var(--muted)}
.msgs{flex:1;overflow-y:auto;padding:16px 16px 8px;display:flex;flex-direction:column;gap:10px;scrollbar-width:none}
.msg{max-width:84%;padding:10px 14px;border-radius:18px;font-size:14.5px;line-height:1.45}
.msg.bot{background:var(--bg2);border-bottom-left-radius:6px;align-self:flex-start}
.msg.me{background:#0D0F12;color:#fff;border-bottom-right-radius:6px;align-self:flex-end}
:root[data-theme="dark"] .msg.me{background:var(--accent);color:var(--accent-ink)}
.msg .who{display:block;font-size:11px;font-weight:600;color:var(--accent);margin-bottom:2px}
.msg.me .who{color:inherit;opacity:.65}
.msg .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.sys{align-self:center;font-size:12px;color:var(--accent);background:var(--accent-soft);padding:5px 11px;border-radius:999px;text-align:center;font-weight:500}
.typing{display:inline-flex;gap:4px;padding:3px 0}.typing i{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:dots 1s infinite}.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes dots{50%{opacity:.25}}
.composer{display:flex;gap:8px;padding:8px 14px 12px}
.composer input{flex:1;min-width:0;border:1px solid var(--line2);background:var(--card);border-radius:12px;padding:12px 14px;outline:0}
.composer input:focus{border-color:var(--accent)}
.send{width:46px;height:46px;border-radius:12px;background:#0D0F12;color:#fff;display:grid;place-items:center;flex:none}
:root[data-theme="dark"] .send{background:var(--accent);color:var(--accent-ink)}
.send svg{width:18px;height:18px}

/* detail */
.dhead{padding:14px 20px 0;display:flex;flex-direction:column;gap:14px}
.iconbtn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;border:1px solid var(--line2);background:var(--card)}
.iconbtn svg{width:19px;height:19px}
.checks{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.checks li{display:grid;grid-template-columns:20px 1fr;gap:10px}
.checks svg{width:17px;height:17px;color:var(--accent);margin-top:2px}
.steps4 div{display:grid;grid-template-columns:34px 1fr;gap:10px;padding:12px 16px}
.steps4 div+div{border-top:1px solid var(--line)}
.steps4 .mono{padding-top:2px}
.steps4 b{display:block;font-weight:600}
.steps4 span{font-size:13px;color:var(--muted)}
.ctabar{display:flex;gap:10px;align-items:center;padding:12px 20px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--bg)}
.ctabar .s{flex:1;min-width:0;font-size:12px;color:var(--muted)}
.ctabar .s b{display:block;color:var(--ink);font-size:15px;font-family:var(--f-d)}

/* flow */
.fhead{padding:14px 20px 8px;display:flex;flex-direction:column;gap:12px;position:sticky;top:0;background:var(--bg);z-index:3}
.fbar{display:flex;align-items:center;justify-content:space-between}
.prog{height:4px;border-radius:2px;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);transition:width .35s}
.fbody{padding:10px 20px 24px;display:flex;flex-direction:column;gap:16px}
.opts{display:grid;gap:8px}
.opt{display:flex;align-items:center;gap:12px;padding:14px 16px;border:1.5px solid var(--line);border-radius:14px;background:var(--card);font-weight:500;text-align:left}
.opt .t{flex:1}.opt .t span{display:block;font-size:12.5px;color:var(--muted);font-weight:400}
.opt .r{width:20px;height:20px;border-radius:50%;border:2px solid var(--line2);flex:none;display:grid;place-items:center}
.opt[aria-checked="true"]{border-color:var(--accent);background:var(--accent-soft)}
.opt[aria-checked="true"] .r{border-color:var(--accent);background:var(--accent)}
.opt[aria-checked="true"] .r::after{content:"";width:7px;height:7px;border-radius:50%;background:var(--accent-ink)}
.opt.box .r{border-radius:6px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;font-weight:600}
.field label em{font-style:normal;color:var(--muted);font-weight:400}
.field input{border:1px solid var(--line2);border-radius:12px;background:var(--card);padding:12px 14px;font-size:15px;outline:0;width:100%}
.field input:focus{border-color:var(--accent)}
.range input{width:100%;accent-color:var(--accent)}
.fnext{padding:12px 20px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--bg)}
.done{padding:36px 20px 24px;display:flex;flex-direction:column;gap:14px}
.okc{width:64px;height:64px;border-radius:20px;background:var(--pilot-bg);color:var(--pilot);display:grid;place-items:center}
.okc svg{width:30px;height:30px}

/* admin */
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi{padding:12px;display:flex;flex-direction:column;gap:8px;border-radius:16px}
.kpi span{font-size:12px;color:var(--muted);line-height:1.25}
.kpi b{font-family:var(--f-d);font-size:28px;font-weight:700;letter-spacing:-.03em;line-height:1}
.chartc svg{width:100%;height:auto;display:block}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.task{padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.task .h{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.task b{font-weight:600;font-size:15px}
.task .m{font-size:12.5px;color:var(--muted)}
.task .f{display:flex;justify-content:space-between;align-items:center;gap:8px}
.who{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink2)}
.who i{width:24px;height:24px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-style:normal;font-weight:700;font-size:11px}
.dlg{display:flex;gap:12px;padding:13px 16px;width:100%;text-align:left;align-items:flex-start}
.dlg .av{width:42px;height:42px;border-radius:50%;background:var(--bg2);border:1px solid var(--line);display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.dlg .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.dlg .n{display:flex;justify-content:space-between;gap:8px;font-weight:600;font-size:14.5px}
.dlg .n small{font-weight:500;color:var(--muted);font-size:12px;font-family:var(--f-m)}
.dlg .l{font-size:13.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dlg .s{display:flex;gap:8px;align-items:center;margin-top:4px;font-size:11.5px;color:var(--muted)}
.floor{display:grid;grid-template-columns:28px repeat(10,1fr);gap:4px;align-items:center}
.floor .fl{font-family:var(--f-m);font-size:11px;color:var(--muted)}
.room{aspect-ratio:1;border-radius:7px;font-size:9.5px;font-weight:600;display:grid;place-items:center;font-family:var(--f-m);border:1px solid transparent}
.r-busy{background:var(--accent-soft);color:var(--accent);border-color:var(--accent-line)}
.r-free{background:var(--card);color:var(--muted);border-color:var(--line2)}
.r-clean{background:var(--proto-bg);color:var(--proto)}
.r-out{background:var(--bad-bg);color:var(--bad)}
.r-in{background:var(--pilot-bg);color:var(--pilot)}
.toggle{display:flex;align-items:center;gap:12px;padding:14px 16px}
.toggle .t{flex:1;min-width:0}.toggle .t b{display:block;font-size:14.5px;font-weight:600}.toggle .t span{font-size:12.5px;color:var(--muted)}
.sw{width:46px;height:28px;border-radius:14px;background:var(--line2);position:relative;flex:none;transition:.2s}
.sw::after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:.2s}
.sw[aria-checked="true"]{background:var(--accent)}.sw[aria-checked="true"]::after{left:21px}
.sw[aria-disabled="true"]{opacity:.55;cursor:not-allowed}
.quote{margin:0;padding:12px 14px;border-radius:14px;background:var(--bg2);font-size:14px;color:var(--ink2)}

/* picker */
.picker{min-height:100%;display:flex;flex-direction:column;gap:18px;padding:18px 20px calc(22px + env(safe-area-inset-bottom,0px))}
.rolec{display:flex;align-items:center;gap:14px;padding:14px;text-align:left;width:100%}
.rolec .t{flex:1}.rolec b{display:block;font-family:var(--f-d);font-weight:600;font-size:17px}.rolec span{font-size:13px;color:var(--muted)}


.device{-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;overscroll-behavior:contain}
.device input{-webkit-user-select:text;user-select:text}
.view{overscroll-behavior:contain}
.sbar{flex:none;height:50px;display:flex;align-items:center;justify-content:space-between;padding:0 30px 0 34px;font-family:var(--f-b);font-weight:600;font-size:15px;position:relative;z-index:8;background:var(--bg);color:var(--ink)}
.sbar .island{position:absolute;left:50%;top:11px;transform:translateX(-50%);width:120px;height:34px;border-radius:20px;background:#000}
.sbar .ic{display:flex;gap:6px;align-items:center}
.sbar svg{height:12px;width:auto;fill:currentColor}
.homeind{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);width:134px;height:5px;border-radius:3px;background:var(--ink);opacity:.85;z-index:45;pointer-events:none}
.device .tabbar,.device .ctabar,.device .fnext{padding-bottom:26px}
.splash{position:absolute;inset:0;z-index:60;background:#0D0F12;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;color:#fff;animation:splashOut .45s ease 1.5s forwards}
.splash .appicon{width:96px;height:96px;border-radius:24px;background:linear-gradient(145deg,#1B2340,#0D0F12);box-shadow:0 0 0 1px rgba(124,157,255,.25),0 20px 50px -10px rgba(29,78,216,.6);display:grid;place-items:center;animation:iconIn .7s cubic-bezier(.22,1.4,.36,1)}
.splash .appicon i{width:38px;height:38px;border-radius:50%;border:5px solid #7C9DFF;box-shadow:0 0 24px rgba(124,157,255,.7)}
.splash b{font-family:var(--f-d);font-size:24px;letter-spacing:-.01em;animation:txtIn .6s ease .25s both}
.splash span{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#9AA6CF;animation:txtIn .6s ease .4s both}
@keyframes iconIn{from{transform:scale(.4);opacity:0}}
@keyframes txtIn{from{opacity:0;transform:translateY(6px)}}
@keyframes splashOut{to{opacity:0;visibility:hidden}}
.stage{background:radial-gradient(70% 60% at 50% 40%,#2A2F3A,#0E1014);height:100%;min-height:0;overflow:hidden;padding:0!important}
html,body{overflow:hidden}
.device{box-shadow:0 0 0 2px #3A3F4A,0 0 0 11px #121418,0 0 0 12px #2C3038,0 50px 100px -20px rgba(0,0,0,.7)}
@media (max-width:520px){html,body{overflow:auto}.stage{overflow:visible}.device{transform:none!important;height:100%!important}.sbar,.homeind{display:none}.device .tabbar,.device .ctabar,.device .fnext{padding-bottom:calc(10px + env(safe-area-inset-bottom,0px))}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.splash{display:none}}
</style>
</head>

/* ---------- СФЕРА НАЛ ---------- */
let sphereRAF=0;
function startSphere(){cancelAnimationFrame(sphereRAF);const c=document.getElementById('sphere');if(!c)return;
 const dpr=Math.min(2,window.devicePixelRatio||1),w=c.clientWidth,h=c.clientHeight;c.width=w*dpr;c.height=h*dpr;const x=c.getContext('2d');x.scale(dpr,dpr);
 const N=900,P=[];for(let i=0;i<N;i++){const u=Math.random()*2-1,t=Math.random()*Math.PI*2,r=i<N*.35?Math.cbrt(Math.random())*.55:1;P.push([Math.sqrt(1-u*u)*Math.cos(t)*r,u*r*.92,Math.sqrt(1-u*u)*Math.sin(t)*r,i<N*.35?1:0])}
 const L=[];for(let i=0;i<22;i++){const a=Math.random()*Math.PI*2,b=Math.random()*Math.PI-Math.PI/2;L.push([Math.cos(b)*Math.cos(a)*1.25,Math.sin(b)*1.15,Math.cos(b)*Math.sin(a)*1.25])}
 const still=matchMedia('(prefers-reduced-motion: reduce)').matches;let ang=0;const R=Math.min(w,h)*.38;
 const proj=([px,py,pz])=>{const cx=px*Math.cos(ang)-pz*Math.sin(ang),cz=px*Math.sin(ang)+pz*Math.cos(ang);return[w/2+cx*R,h/2+py*R,cz]};
 const draw=()=>{x.clearRect(0,0,w,h);
  const lp=L.map(proj);x.strokeStyle='rgba(140,160,255,.22)';x.lineWidth=.7;x.beginPath();for(let i=0;i<lp.length;i++)for(let j=i+1;j<lp.length;j++){const dx=lp[i][0]-lp[j][0],dy=lp[i][1]-lp[j][1];if(dx*dx+dy*dy<R*R*.45){x.moveTo(lp[i][0],lp[i][1]);x.lineTo(lp[j][0],lp[j][1])}}x.stroke();
  lp.forEach(([a,b])=>{x.fillStyle='rgba(200,215,255,.9)';x.beginPath();x.arc(a,b,1.6,0,7);x.fill()});
  for(const p of P){const[a,b,z]=proj(p);const al=p[3]?.9:.25+.45*(z+1)/2;x.fillStyle=p[3]?`rgba(235,240,255,${al})`:`rgba(110,150,255,${al})`;x.fillRect(a,b,p[3]?1.3:1,p[3]?1.3:1)}
  ang+=.0035;if(!still&&document.getElementById('sphere')===c)sphereRAF=requestAnimationFrame(draw)};draw()}

/* ---------- ОТРИСОВКА ---------- */
function render(keep){
 document.getElementById('asideRoles').innerHTML=Object.entries(ROLES).map(([k,r])=>`<button data-role="${k}" aria-pressed="${S.role===k}">${r.name}<span class="chev">${sv(I.chev)}</span></button>`).join('');
 let html='',foot='',tabs=true;const sc=S.screen;
 if(!S.role){html=vPicker();tabs=false}
 else if(sc?.t==='prod'){html=bDetail(sc.id);foot=bDetailCta(sc.id);tabs=false}
 else if(sc?.t==='flow'){const f=bFlow();html=f.b;foot=f.f;tabs=false}
 else if(sc?.t==='done'){html=bDone();tabs=false}
 else{const V={guest:{home:gHome,serv:gServ,aura:vChat,reqs:gReqs,me:gMe},buyer:{cat:bCat,proj:bProj,aura:vChat,me:()=>meCommon('Ираклий Кавтарадзе','Клиент AISI LAB')},admin:{sum:aSum,tasks:aTasks,dlg:aDlg,rooms:aRooms,me:aMore}}[S.role];html=V[S.tab]()}
 const keepScroll=keep?$v.scrollTop:0;
 $v.innerHTML=html;$v.style.overflowY=(S.tab==='aura'&&!sc)?'hidden':'auto';
 document.querySelectorAll('.ctabar,.fnext').forEach(e=>e.remove());if(foot)$v.insertAdjacentHTML('afterend',foot);
 $t.hidden=!tabs;
 if(tabs){const r=ROLES[S.role];$t.className='tabbar'+(r.tabs.length===4?' four':'');
  const badge=k=>k==='reqs'?S.greqs.filter(x=>x.stage<2).length:k==='sum'?S.escs.length:k==='tasks'?S.tasks.filter(x=>x.st==='new').length:k==='proj'&&S.project?1:0;
  $t.innerHTML=r.tabs.map(([k,t,ic])=>`<button class="tab" data-tab="${k}" ${S.tab===k?'aria-current="page"':''}>${ic?sv(ic):`<img src="${AVA}" alt="">`}${t}${badge(k)?`<span class="dot">${badge(k)}</span>`:''}</button>`).join('')}
 if(!keep){$v.scrollTop=0;$v.classList.remove('anim');void $v.offsetWidth;$v.classList.add('anim')}else $v.scrollTop=keepScroll;
 const m=document.getElementById('msgs');if(m)m.scrollTop=m.scrollHeight;
 startSphere();
}
function setRole(r){S.role=r;store.set('role',r);S.tab=r?ROLES[r].tabs[0][0]:null;S.screen=null;S.hist=[];closeSheet();render()}
function go(sc){S.hist.push(S.screen);S.screen=sc;render()}
function back(){S.screen=S.hist.pop()||null;render()}
function startDemo(prod){S.flow={step:1,prod:prod||'hotels',biz:!prod||prod==='hotels'?'hotel':'',rooms:40,ch:['WhatsApp'],name:'',co:'',ct:''};go({t:'flow'})}

document.addEventListener('click',e=>{
 if($o.onclick&&$o.contains(e.target))return;
 if(e.target.matches('[data-closesheet]')){closeSheet();return}
 const b=e.target.closest('button,a');if(!b)return;const d=b.dataset;
 if(d.role){setRole(d.role);return}
 if(d.switch!==undefined){setRole(null);return}
 if(d.tab){S.tab=d.tab;S.screen=null;S.hist=[];closeSheet();render();return}
 if(d.back!==undefined){back();return}
 if(d.th){if(d.th==='auto')delete document.documentElement.dataset.theme;else document.documentElement.dataset.theme=d.th;store.set('theme',d.th);render(true);return}
 if(d.ask){say(d.ask);return}
 if(d.say){say(d.say);return}
 if(d.act){const a=d.act;if(a.startsWith('p:')){go({t:'prod',id:a.slice(2)});return}if(a==='demo'){startDemo(null);return}if(a==='bill'){billSheet();return}servSheet(a);return}
 if(d.serv){servSheet(d.serv);return}
 if(d.bill!==undefined){billSheet();return}
 if(d.forget!==undefined){S.gmem.splice(+d.forget,1);saveAll();toast('Удалено из памяти AURA');render(true);return}
 if(d.closesheetBtn!==undefined){closeSheet();return}
 if(d.cat){S.cat=d.cat;render(true);return}
 if(d.prod){go({t:'prod',id:d.prod});return}
 if(d.demo!==undefined){startDemo(d.demo==='nal'?null:d.demo);return}
 if(d.biz){S.flow.biz=d.biz;render(true);return}
 if(d.ch){const c=S.flow.ch,i=c.indexOf(d.ch);i<0?c.push(d.ch):c.splice(i,1);render(true);return}
 if(d.fback!==undefined){if(S.flow.step>1){S.flow.step--;render()}else back();return}
 if(d.fnext!==undefined){if(S.flow.step<3){S.flow.step++;render();return}S.project={...S.flow};store.set('project',S.project);S.hist=[];S.tab='proj';S.screen={t:'done'};render();return}
 if(d.esc){escSheet(+d.esc);return}
 if(d.resolve){const e0=S.escs.find(x=>x.id===+d.resolve);
  if(e0&&e0.guest)S.gchat.push({f:'bot',t:d.how==='approve'?'Руководитель одобрил возврат. Сумму вернём на карту или вычтем из счёта номера, как вам удобнее.':d.how==='aura'?'Руководитель посмотрел вашу просьбу и скоро свяжется с вами.':'Вашей просьбой занимается администратор, он подойдёт в течение 15 минут.'});
  if(e0&&e0.title.includes('112')){const t=S.tasks.find(x=>x.room==='112');if(t){t.st=d.how==='assign'?'work':'done';t.who='Нана';t.hot=0}}
  S.escs=S.escs.filter(x=>x.id!==+d.resolve);saveAll();closeSheet();toast(d.how==='approve'?'Решение отправлено гостю':d.how==='aura'?'Помощник передаст ответ':'Поручено сотруднику');render(true);return}
 if(d.tf){S.taskF=d.tf;render(true);return}
 if(d.take){const t=S.tasks.find(x=>x.id===+d.take);t.st='work';t.who=STAFF[t.svc]||'Нана';t.hot=0;const g=S.greqs.find(x=>x.id===t.rid);if(g)g.stage=1;saveAll();toast('Назначено: '+t.who);render(true);return}
 if(d.finish){const t=S.tasks.find(x=>x.id===+d.finish);t.st='done';const g=S.greqs.find(x=>x.id===t.rid);if(g){g.stage=2;S.gchat.push({f:'bot',t:'Готово: «'+t.what+'». Если нужно что-то ещё, напишите.'})}saveAll();toast('Задача закрыта, гость получит уведомление');render(true);return}
 if(d.dq){dlgReply(+d.di,d.dq);toast('Ответ отправлен гостю');return}
 if(d.dlg){dlgSheet(+d.dlg);return}
 if(d.room){roomSheet(d.room);return}
 if(d.tone){S.aura.tone=d.tone;render(true);return}
 if(d.auto){S.aura.auto=+d.auto;render(true);return}
 if(d.lang){const l=S.aura.langs,i=l.indexOf(d.lang);i<0?l.push(d.lang):l.length>1&&l.splice(i,1);render(true);return}
 if(d.night!==undefined){S.aura.night=!S.aura.night;render(true);return}
 if(d.resetdemo!==undefined){['tasks','escs','greqs','dlgs','project','gmem'].forEach(k=>{try{localStorage.removeItem('op4_'+k)}catch(e){}});location.reload();return}
 if(d.saveaura!==undefined){store.set('aura',S.aura);toast('Настройки сохранены');return}
});

 if(t.id==='f_rooms'){S.flow.rooms=+t.value;document.getElementById('roomsv').textContent=t.value;return}
 const m={f_name:'name',f_co:'co',f_ct:'ct'};if(m[t.id]&&S.flow){S.flow[m[t.id]]=t.value;const nb=document.querySelector('[data-fnext]');if(nb)nb.disabled=!(S.flow.name.trim()&&S.flow.ct.trim().length>=4)}});
document.addEventListener('submit',e=>{e.preventDefault();
 if(e.target.id==='dform'){const v=document.getElementById('din').value.trim();if(v){dlgReply(+e.target.dataset.di,v);toast('Ответ отправлен гостю')}return}
 if(e.target.id==='cform'){const v=document.getElementById('cin').value.trim();if(v)say(v)}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$o.innerHTML)closeSheet()});

const th=store.get('theme','auto');if(th!=='auto')document.documentElement.dataset.theme=th;
S.tab=S.role?ROLES[S.role].tabs[0][0]:null;
render();
(function(){const c=document.getElementById('clock');const t=()=>{const d=new Date();c.textContent=d.getHours()+':'+String(d.getMinutes()).padStart(2,'0')};t();setInterval(t,15000)})();
(function(){const d=document.getElementById('device');const fit=()=>{if(innerWidth<=520){d.style.transform='';return}const k=Math.min(1,(innerHeight-32)/864,(innerWidth-32)/412);d.style.transform='scale('+k+')'};fit();addEventListener('resize',fit)})();
setTimeout(()=>{const sp=document.getElementById('splash');if(sp)sp.remove()},2100);
